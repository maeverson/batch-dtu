apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 5000
      # `execution_id` é a chave de correlação da Fase 1: do registro de
      # auditoria para o log da execução, em um clique.
      derivedFields:
        - name: execution_id
          matcherRegex: 'execution_id[=:"\s]+([0-9a-fA-F-]{8,})'
          url: '/explore?left={"datasource":"loki","queries":[{"expr":"{job=\"batch\"} |= \"${__value.raw}\""}]}'
          datasourceUid: loki

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
