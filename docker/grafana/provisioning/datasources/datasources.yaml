apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 5000
      # `execution_id` é a chave de correlação da Fase 1: do registro de
      # auditoria para o log da execução, em um clique.
      derivedFields:
        - name: execution_id
          matcherRegex: 'execution_id[=:"\s]+([0-9a-fA-F-]{8,})'
          url: '/explore?left={"datasource":"loki","queries":[{"expr":"{job=\"batch\"} |= \"${__value.raw}\""}]}'
          datasourceUid: loki

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST

  - name: Postgres
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    user: batch
    # Catálogo: fonte do painel de execuções manuais (observability, Etapa 1.3).
    # Credencial de dev fixa, igual ao resto deste compose (docker-compose.yaml,
    # serviço `postgres`) — não aponta para o parque real. Este arquivo é lido
    # direto pelo Grafana, sem passar pela interpolação do compose, por isso
    # não usa `${POSTGRES_USER:-...}` como o compose faz.
    secureJsonData:
      password: batch_dev
    jsonData:
      database: batch_catalog
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
