[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# A URL real vem de DATABASE_URL_MIGRATIONS (env.py); este valor é só fallback.
sqlalchemy.url = postgresql+psycopg://batch_migrator:batch_migrator_dev@localhost:5432/batch_catalog

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
