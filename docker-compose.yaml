# Ambiente de desenvolvimento local da Plataforma de Jobs Agendados (Batch DTU).
#
# Sobe só o que a Fase 1 precisa por padrão; o resto entra por profile, para não
# custar 3 GB de imagem quem só está mexendo no catálogo.
#
#   docker compose up -d                        # postgres + loki + grafana
#   docker compose --profile auth up -d         # + keycloak (stand-in do Entra ID)
#   docker compose --profile legacy up -d       # + host legado simulado (SSH + main.sh)
#   docker compose --profile storage up -d      # + minio (S3) e sftp
#   docker compose --profile secrets up -d      # + vault (dev)
#   docker compose --profile all up -d          # tudo
#
# Nada aqui aponta para o parque real. O serviço `legacy` existe justamente para
# desenvolver o backend SSH da Fase 1 sem tocar em produção.

name: batch-dtu

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Catálogo, execuções e auditoria (ADR-003: RDS PostgreSQL em produção)
  # ---------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:16-alpine
    container_name: batch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batch_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-batch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batch_dev}
      # Locale/collation coerentes com o parque (nomes em espanhol).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=UTC          # execução é sempre UTC; TZ do job é dado, não ambiente
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batch} -d ${POSTGRES_DB:-batch_catalog}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Observabilidade: espelho local do Grafana Cloud (Loki/Mimir)
  # ---------------------------------------------------------------------------
  loki:
    <<: *restart
    image: grafana/loki:3.3.2
    container_name: batch-loki
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 30

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    container_name: batch-prometheus
    # Stand-in local do Mimir: mesma interface de scrape/PromQL.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=72h
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # no Linux `host.docker.internal` nao resolve sozinho; a Platform API
      # roda no host, fora do compose
      - "host.docker.internal:host-gateway"

  grafana:
    <<: *restart
    image: grafana/grafana:11.5.1
    container_name: batch-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_LOG_LEVEL: warn
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.21
    container_name: batch-mailpit
    # Captura os steps `send_mail`/`send_infra_mail` sem enviar nada de verdade.
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # ---------------------------------------------------------------------------
  # Identidade: stand-in do Entra ID (OIDC) com as roles batch.* da Fase 1
  # ---------------------------------------------------------------------------
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    container_name: batch-keycloak
    profiles: [auth, all]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # ---------------------------------------------------------------------------
  # Host legado simulado: SSH + main.sh stub + wrapper com `command=`
  # É contra este serviço que o ExecutionBackend da Fase 1 é desenvolvido.
  # ---------------------------------------------------------------------------
  legacy:
    <<: *restart
    build:
      context: ./docker/legacy
    image: batch-dtu/legacy-host:dev
    container_name: batch-legacy
    profiles: [legacy, all]
    ports:
      - "${LEGACY_SSH_PORT:-2222}:22"
    volumes:
      # A chave do backoffice_svc é gerada no primeiro start e fica aqui,
      # para a Platform API usar. O diretório está no .gitignore.
      - ./docker/legacy/keys:/keys
      - legacy-logs:/opt2/batch_v2/batch-commons-framework/logs

  # ---------------------------------------------------------------------------
  # Armazenamento: destinos dos steps download/upload (101 aliases SFTP, 5 S3)
  # ---------------------------------------------------------------------------
  minio:
    <<: *restart
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: batch-minio
    profiles: [storage, all]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-batch}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-batch_dev_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  sftp:
    <<: *restart
    image: atmoz/sftp:alpine
    container_name: batch-sftp
    profiles: [storage, all]
    # usuario:senha:uid — destino de teste para download_remote/upload_remote
    command: ${SFTP_USERS:-cliente_teste:cliente_teste:1001}
    ports:
      - "${SFTP_PORT:-2223}:22"
    volumes:
      - sftp-data:/home/cliente_teste/upload

  # ---------------------------------------------------------------------------
  # Vault (dev): aliases de conexão resolvidos em runtime a partir da Fase 2
  # ---------------------------------------------------------------------------
  vault:
    <<: *restart
    image: hashicorp/vault:1.18
    container_name: batch-vault
    profiles: [secrets, all]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-batch-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"

volumes:
  postgres-data:
  loki-data:
  prometheus-data:
  grafana-data:
  minio-data:
  sftp-data:
  legacy-logs:
