; Agente APM da Platform API (`NEW_RELIC_CONFIG_FILE=/etc/newrelic/newrelic.ini`).
;
; O que este arquivo garante, além de ligar o agente: que o `execution_id` que
; a API carimba na transação (src/platform_api/telemetry.py) e o `execution_id`
; que o log do host carrega sejam a MESMA chave de busca no New Relic. Sem isso
; sobra correlacionar por horário, que é o que a Fase 1 existe para acabar.

[newrelic]
license_key = ${NEW_RELIC_LICENSE_KEY}
app_name = ${NEW_RELIC_APP_NAME}
monitor_mode = true
log_level = info
high_security = false
distributed_tracing.enabled = true

; Atributos customizados (execution_id, batch.*) precisam chegar aos eventos de
; transação — é por eles que se cruza APM × log × tabela `execution`.
transaction_events.attributes.enabled = true
custom_insights_events.enabled = true

; O Bearer token do Entra e o corpo das requisições NÃO vão para o New Relic:
; o corpo de `POST /executions` tem justificativa e datas, e o header tem
; credencial. Nada disso é telemetria.
attributes.exclude = request.headers.authorization request.headers.cookie request.parameters.*
transaction_tracer.record_sql = obfuscated

[newrelic:uat]
app_name = batch-dtu-platform-api (UAT)

[newrelic:prod]
app_name = batch-dtu-platform-api (PROD)
