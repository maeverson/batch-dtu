# Vocabulário de curadoria do seed do job-catalog.
#
# Os nomes de contrato e de wrapper do legado seguem a convenção
#   <ambiente>_<cliente...>_<pais...>_<abrev_dominio>_<sufixo_do_processo>
# Ex.: prd_dal_col_bs2.json         -> PROD, cliente dal, país col, domínio base2
#      prd_ggt_slv_cri_bs2_manual   -> PROD, cliente ggt, países slv+cri, base2, sufixo manual
#      prd_nuvy_dal_col_ebc         -> PROD, cliente nuvy_dal, país col, emboces
#
# O parser NÃO adivinha: só resolve o que está declarado aqui. Código não mapeado
# é preservado como `*_code` e contabilizado no relatório para curadoria.

# Prefixo de ambiente. O legado usa três grafias para produção — confirmado no
# inventário de 09/2026: 570x prd_, 2x prod_, 1x pro_.
environments:
  prd: PROD
  prod: PROD
  pro: PROD
  uat: UAT
  tst: TEST
  test: TEST
  dev: DEV

# Abreviação de domínio -> diretório do framework (processes/<dominio>/).
# O diretório é a fonte da verdade do domínio; a abreviação serve para localizar
# a fronteira entre cliente/país e sufixo do processo dentro do nome.
domains:
  base2: [bs2]
  emboces: [ebc]
  emisiones: [emi]
  transacciones: [txn, dtx, tx]
  reportes: [rpt]
  saldos: [sal]
  otros: [otr]

# Código de país -> ISO 3166-1 alpha-2. `INTL` marca processos multi-país
# ("internacional"), que não têm país único.
countries:
  col: CO
  colombia: CO
  pan: PA
  panama: PA
  dom: DO
  dominicana: DO
  republica_dominicana: DO
  rep_dominicana: DO
  per: PE
  peru: PE
  ven: VE
  venezuela: VE
  gtm: GT
  gua: GT
  guatemala: GT
  hon: HN
  honduras: HN
  ecu: EC
  ecuador: EC
  mex: MX
  mexico: MX
  slv: SV
  salvador: SV
  cri: CR
  costa_rica: CR
  costarica: CR
  jam: JM
  jamaica: JM
  chl: CL
  chile: CL
  pri: PR
  puerto_rico: PR
  pto_rico: PR
  int: INTL
  internacional: INTL
  # Escopos regionais (não são ISO 3166): o job atende vários países.
  cam: CAM          # Centroamérica
  centro_america: CAM
  internacional_cam: CAM

# Código de cliente -> nome canônico. DELIBERADAMENTE VAZIO.
#
# `catalog import` gera o stub de curadoria em <--out>/clients.todo.yaml
# (default: seed/raw/reports/clients.todo.yaml) com todos os códigos
# encontrados e as evidências de cada um — domínios, países, nº de jobs,
# exemplos de nome e aliases de conexão. Preencha `nome` com o owner do
# domínio e traga os pares resolvidos para o mapa `clients` aqui.
#
# O stub fica fora do git de propósito: os nomes de job que ele cita
# identificam cliente. Trazer o par código->nome para cá é decisão de quem
# versiona este arquivo.
#
# Nenhum código é inventado aqui: adivinhar cliente errado num job de
# upload_remote é risco de enviar arquivo ao cliente errado.
# Nome canônico por código de cliente. Cada entrada é DERIVADA do campo `client`
# dos contratos, corroborada nos DOIS hosts — PROD e UAT são clones de
# homologação, então o mesmo código aparecendo com o mesmo nome nos dois é
# evidência, não coincidência. Contagens de 09/2026 (PROD + UAT).
clients:
  alianza_valle: alianza_del_valle   # 3 + 2, unânime
  ban: banreservas                   # 52 + 50 (grafia `banreserva` 8x é variação)
  bnp: banco_panama                  # 13 + 32 — ver shared_client_codes
  coo: coopcentral                   # 17 + 26 — ver shared_client_codes
  dal: dale                          # 15 + 11, unânime
  fih: fihogar                       # 4 + 4, unânime
  mft: mftech                        # 9 + 15, unânime
  nuvy_sod: sodexo                   # 3 em PROD; ausente de UAT
  sod: sodexo                        # 28 + 14, unânime
  stb: servitebca                    # 110 + 71 (grafia `tebca_servitebca` 21x é variação)
  # Mesma entidade em duas grafias (`bancobogota` / `banco_bogota`), sem
  # dominante estável entre os hosts. Nome canônico escolhido pela forma legível,
  # em linha com `banco_panama`. CONFIRMAR com o owner.
  bbt: banco_bogota
  # `mas`: nenhum contrato declara `client` — não há de onde derivar.
  # Só o owner pode dizer. Ver seed/raw/reports/triagem-owners.md.

# Códigos de 3 letras que pertencem legitimamente a MAIS DE UM cliente. Não são
# erro de contrato: aparecem nos dois hosts com a mesma proporção, e host clonado
# repetindo o mesmo desvio é convenção, não engano. Declarar aqui evita que a
# detecção de outlier os acuse a cada reconciliação.
shared_client_codes:
  bnp: [banco_panama, banco_nacional_panama]   # 2 + 2
  tup: [tupanamipana, billet]                  # 1 + 1
  coo: [coopcentral, cooperativa_29]           # 2 + 3

# Sufixos de nome que indicam variante/experimento e merecem revisão na carga.
# Não alteram a semântica; entram como `flags` no registro do job.
variant_suffixes:
  - v2
  - v3
  - new
  - old
  - manual
  - masivo
  - test
  - bkp
  - copy
  - np
